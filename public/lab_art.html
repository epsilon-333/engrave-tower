<title>각인의 탑 체험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="style.css">
<style>
  #lab { position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; width: 330px; max-width: 92vw; overflow-y: auto; background: rgba(24,20,32,0.94); color: #efe6d6; font: 13px/1.5 Galmuri11, "Malgun Gothic", sans-serif; padding: 10px 12px 40px; box-sizing: border-box; border-right: 1px solid #4a4458; }
  #lab.min { width: auto; top: 0; bottom: auto; left: 50%; transform: translateX(-50%); padding: 4px 10px; overflow: visible; border: 1px solid #4a4458; border-top: 0; border-radius: 0 0 8px 8px; }
  #lab.min > :not(.bar) { display: none; }
  #lab.min .bar h1 { display: none; }
  #lab .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #lab h1 { font-size: 15px; margin: 0; color: #ffcf5a; }
  #lab h2 { font-size: 13px; margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid #3a3448; color: #ffcf5a; }
  #lab .muted { color: #a89fb4; font-size: 12px; }
  #lab select, #lab input[type=number] { background: #2a2734; color: #efe6d6; border: 1px solid #4a4458; border-radius: 5px; padding: 3px 4px; font: inherit; max-width: 100%; }
  #lab button { background: #3a3448; color: #efe6d6; border: 1px solid #5a5468; border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; margin: 2px 2px 2px 0; }
  #lab button:hover { border-color: #ffcf5a; }
  #lab button.go { background: #5a4a1e; border-color: #ffcf5a; }
  #lab .row { margin: 4px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  #lab .row > label { min-width: 52px; color: #a89fb4; }
  #lab label.chk { display: flex; gap: 4px; align-items: center; }
  #toast { position: fixed; z-index: 60; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2a2734; color: #efe6d6; border: 1px solid #ffcf5a; border-radius: 8px; padding: 6px 14px; font: 13px Galmuri11, sans-serif; display: none; }

  html, body { background: #14111b; }
</style>
<div id="title" hidden></div>
<div id="game" hidden>
  <canvas id="canvas"></canvas>
  <div id="panel" hidden></div>
  <div id="overlay" hidden></div>
</div>
<div id="lab"></div>
<div id="toast"></div>
<script>window.__LAB = true;</script>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/lab.js"></script>
